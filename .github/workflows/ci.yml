name: Validate atlas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run build

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: book
          latexmk_use_xelatex: false
